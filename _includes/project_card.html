<div class="row project-card">
    <div class="py-3 col-md-6 img-column order-1 {% if remainder == 0 %}order-md-2{% else %}order-md-1{% endif %}">
        <a href="{{ include.project.link }}" target="_blank">
            <img src="{{ include.project.image | relative_url }}" class="img-project shadow-lg">
        </a>
    </div>

    <div class="col-md-6 order-2 {% if remainder == 0 %}order-md-1{% else %}order-md-2{% endif %}">
        <div class="project-content-box">
            <h3 class="project-title">{{ include.project.title }}</h3>
            <div class="project-description">
                {{ include.project.content | markdownify }}
            </div>
            {% if include.project.link %}
            <a href="{{ include.project.link }}" class="link-academic" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                {{ include.project.link_text }}
            </a>
            {% endif %}
        </div>
    </div>
</div>
