# Jekyll configuration for GitHub Pages
title: Computational Astrophysics Lab
description: NTU Computational Astrophysics Lab
author: CA Lab
url: "https://vivi235711.github.io"
baseurl: "/Calab-new-web.github.io"

# Build settings
markdown: kramdown
exclude:
  - .github/workflows/jekyll-gh-pages.yml
  - README.md
  - LICENSE
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - _tools/export-bibtex.bib
  - _tools/bib_to_yml.py

# Ensure assets are served from root
relative_permalinks: false

plugins:
  - jekyll-paginate

permalink: /:year/:month/:day/:title.html
paginate: 5
paginate_path: "/news/page:num/"

collections:
  members:
    output: false # Set to false to prevent generating individual member pages (list only)
    permalink: /members/:path/
  useful:
    output: false
    permalink: /useful/:path/
  courses:
    output: false # Courses usually don't need individual pages
    permalink: /courses/:path/
  projects:
    output: false # Project details shown via Modals, no separate pages needed
    permalink: /projects/:path/

sass:
  # The style option controls the output format of the compiled CSS.
  style: compressed
  sourcemap: always